<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .search-section {
            text-align: center;
        }

        .search-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .input-group input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .input-group button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .weather-display {
            display: none;
        }

        .weather-display.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 5rem;
        }

        .weather-info h3 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 8px;
        }

        .weather-temp {
            font-size: 3rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 4px;
        }

        .weather-desc {
            color: #666;
            text-transform: capitalize;
            font-size: 1.1rem;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 16px;
            border-radius: 10px;
            margin-top: 16px;
            display: none;
        }

        .error-message.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .history-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eaeaea;
        }

        .history-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .history-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .history-city {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .history-country {
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .history-temp {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }

        .history-desc {
            color: #666;
            text-transform: capitalize;
            margin-bottom: 12px;
        }

        .history-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: #888;
        }

        .history-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .empty-history {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-history svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            .weather-main {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>

        <!-- Search Section -->
        <div class="card search-section">
            <h2>Search Weather</h2>
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Tokyo, New York)" autocomplete="off">
                <button id="searchBtn">Get Weather</button>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching weather...</p>
            </div>
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Current Weather Display -->
            <div class="weather-display" id="weatherDisplay">
                <div class="weather-main">
                    <div class="weather-icon" id="weatherIcon">☀️</div>
                    <div class="weather-info">
                        <h3 id="cityName">City Name</h3>
                        <div class="weather-temp" id="temperature">--°C</div>
                        <div class="weather-desc" id="description">--</div>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity">--%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="windSpeed">-- m/s</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value" id="pressure">-- hPa</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value" id="feelsLike">--°C</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div class="card history-section">
            <h2>
                Search History
                <span class="history-count" id="historyCount">0</span>
            </h2>
            <div class="history-list" id="historyList">
                <div class="empty-history" id="emptyHistory">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <p>No search history yet. Search for a city to see it here!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- config.js is gitignored locally and generated by the GitHub Actions deploy workflow -->
    <script src="config.js"></script>
    <script type="module">
        const { SUPABASE_URL, SUPABASE_ANON_KEY, OPENWEATHER_API_KEY } = window.APP_CONFIG || {};

        // Initialize Supabase client
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const weatherDisplay = document.getElementById('weatherDisplay');
        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');
        const historyCount = document.getElementById('historyCount');

        // Weather display elements
        const weatherIcon = document.getElementById('weatherIcon');
        const cityName = document.getElementById('cityName');
        const temperature = document.getElementById('temperature');
        const description = document.getElementById('description');
        const humidity = document.getElementById('humidity');
        const windSpeed = document.getElementById('windSpeed');
        const pressure = document.getElementById('pressure');
        const feelsLike = document.getElementById('feelsLike');

        // Weather icon mapping
        const weatherIcons = {
            'Clear': '☀️',
            'Clouds': '☁️',
            'Rain': '🌧️',
            'Drizzle': '🌦️',
            'Thunderstorm': '⛈️',
            'Snow': '❄️',
            'Mist': '🌫️',
            'Fog': '🌫️',
            'Haze': '🌫️',
            'Dust': '🌫️',
            'Sand': '🌫️',
            'Ash': '🌫️',
            'Squall': '💨',
            'Tornado': '🌪️'
        };

        // Show/hide loading
        function setLoading(isLoading) {
            loading.classList.toggle('visible', isLoading);
            searchBtn.disabled = isLoading;
            cityInput.disabled = isLoading;
        }

        // Show error
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('visible');
            weatherDisplay.classList.remove('visible');
        }

        // Hide error
        function hideError() {
            errorMessage.classList.remove('visible');
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Format date (Supabase returns ISO strings)
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // Rows are insertable by anyone with the public key, so escape before using innerHTML
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        // Fetch weather from OpenWeatherMap
        async function fetchWeather(city) {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${OPENWEATHER_API_KEY}&units=metric`;
            const response = await fetch(url);
            
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('City not found. Please check the spelling and try again.');
                }
                if (response.status === 401) {
                    throw new Error('Invalid API key. Please check your OpenWeatherMap API key.');
                }
                throw new Error(`Failed to fetch weather: ${response.statusText}`);
            }
            
            return response.json();
        }

        // Save weather to Supabase
        async function saveWeather(weatherData) {
            const { data, error } = await supabaseClient
                .from('weather_history')
                .insert({
                    city_name: weatherData.name,
                    country_code: weatherData.sys.country,
                    temperature: weatherData.main.temp,
                    feels_like: weatherData.main.feels_like,
                    humidity: weatherData.main.humidity,
                    pressure: weatherData.main.pressure,
                    wind_speed: weatherData.wind.speed,
                    weather_main: weatherData.weather[0].main,
                    weather_description: weatherData.weather[0].description,
                    weather_icon: weatherData.weather[0].icon,
                    timestamp: new Date().toISOString()
                })
                .select()
                .single();

            if (error) {
                console.error('Supabase error:', error);
                throw new Error(`Failed to save to database: ${error.message}`);
            }
            
            return data;
        }

        // Load history from Supabase
        async function loadHistory() {
            const { data, error } = await supabaseClient
                .from('weather_history')
                .select('*')
                .order('timestamp', { ascending: false })
                .limit(50);

            if (error) {
                console.error('Supabase error:', error);
                return [];
            }
            
            return data || [];
        }

        // Render history
        function renderHistory(history) {
            historyCount.textContent = history.length;
            
            if (history.length === 0) {
                emptyHistory.style.display = 'block';
                historyList.innerHTML = '';
                historyList.appendChild(emptyHistory);
                return;
            }

            emptyHistory.style.display = 'none';
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <span class="history-city">${escapeHtml(item.city_name)}</span>
                        <span class="history-country">${escapeHtml(item.country_code)}</span>
                    </div>
                    <div class="history-temp">${Math.round(item.temperature)}°C</div>
                    <div class="history-desc">${escapeHtml(item.weather_description)}</div>
                    <div class="history-meta">
                        <span>💧 ${escapeHtml(item.humidity)}%</span>
                        <span>💨 ${escapeHtml(item.wind_speed)} m/s</span>
                        <span>🕐 ${formatDate(item.timestamp)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Display current weather
        function displayWeather(data) {
            const icon = weatherIcons[data.weather[0].main] || '🌤️';
            weatherIcon.textContent = icon;
            cityName.textContent = `${data.name}, ${data.sys.country}`;
            temperature.textContent = `${Math.round(data.main.temp)}°C`;
            description.textContent = data.weather[0].description;
            humidity.textContent = `${data.main.humidity}%`;
            windSpeed.textContent = `${data.wind.speed} m/s`;
            pressure.textContent = `${data.main.pressure} hPa`;
            feelsLike.textContent = `${Math.round(data.main.feels_like)}°C`;
            
            weatherDisplay.classList.add('visible');
            hideError();
        }

        // Handle search
        async function handleSearch() {
            const city = cityInput.value.trim();
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            setLoading(true);
            hideError();

            try {
                const weatherData = await fetchWeather(city);
                displayWeather(weatherData);
                await saveWeather(weatherData);
                const history = await loadHistory();
                renderHistory(history);
                cityInput.value = '';
            } catch (error) {
                showError(error.message);
                weatherDisplay.classList.remove('visible');
            } finally {
                setLoading(false);
            }
        }

        // Initialize
        async function init() {
            try {
                const history = await loadHistory();
                renderHistory(history);
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        // Event listeners
        searchBtn.addEventListener('click', handleSearch);
        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        // Start
        init();
    </script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
